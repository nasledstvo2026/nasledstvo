<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Архитектура fz425-agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --skill: #ddd6fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --skill: #5b21b6;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 1050px; margin: 24px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 18px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .skill { fill: var(--skill); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
</style>
<main>
<svg viewBox="0 0 1020 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="var(--line)" />
    </marker>
    <marker id="arrb" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="var(--process)" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="24" class="title">Архитектура fz425-agent — сквозной RAG с верификацией</text>

  <!-- ========== ZONES ========== -->
  <!-- Flow zone -->
  <rect x="15" y="38" width="990" height="170" rx="8" class="zone" />
  <text x="25" y="55" class="small">Поток запроса</text>

  <!-- Search zone -->
  <rect x="520" y="220" width="485" height="220" rx="8" class="zone" />
  <text x="530" y="237" class="small">Embedding-поиск (law-search)</text>

  <!-- Knowledge zone -->
  <rect x="15" y="220" width="490" height="220" rx="8" class="zone" />
  <text x="25" y="237" class="small">База знаний</text>

  <!-- Infra zone -->
  <rect x="15" y="455" width="990" height="100" rx="8" class="zone" />
  <text x="25" y="472" class="small">Инфраструктура</text>

  <!-- ========== EDGES (connectors before nodes) ========== -->
  <!-- User → Gateway -->
  <path d="M 55,113 H 105" class="edge" marker-end="url(#arr)" />
  <!-- Gateway → Main -->
  <path d="M 255,113 H 305" class="edge" marker-end="url(#arr)" />
  <!-- Main → fz425-agent -->
  <path d="M 425,113 H 475" class="edge" marker-end="url(#arr)" />
  <!-- fz425-agent → Verifier -->
  <path d="M 555,145 V 190" class="edge" marker-end="url(#arr)" />
  <!-- Verifier → Gateway (response) -->
  <path d="M 490,190 H 265 V 163 H 245" class="edge" marker-end="url(#arr)" />
  <!-- Gateway → User (response) -->
  <path d="M 120,163 V 133 H 105" class="edge" marker-end="url(#arr)" />

  <!-- fz425-agent → law-search API -->
  <path d="M 595,80 V 280 H 640" class="edge" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" />
  <text x="600" y="270" class="small" fill="#7c3aed">search?q=</text>

  <!-- law-search API → FAISS -->
  <path d="M 820,280 V 360" class="edge" marker-end="url(#arr)" />
  <!-- FAISS → law-search (arrows both ways for vectors) -->
  <text x="708" y="330" class="small">top-5⬆️ ⬇️vec</text>

  <!-- SKILL.md → fz425-agent -->
  <path d="M 130,330 H 450 V 195" class="edge" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" />
  <text x="200" y="322" class="small" fill="#7c3aed">приоритет документов</text>

  <!-- Documents → SKILL.md -->
  <path d="M 50,370 H 80" class="edge" marker-end="url(#arr)" />

  <!-- ========== FLOW NODES (Row 1) ========== -->
  <!-- User -->
  <rect x="15" y="88" width="80" height="50" rx="6" class="node external" />
  <text x="55" y="110" text-anchor="middle" class="label">👤 Юзер</text>
  <text x="55" y="126" text-anchor="middle" class="small">Telegram</text>

  <!-- Gateway -->
  <rect x="110" y="88" width="130" height="50" rx="6" class="node neutral" />
  <text x="175" y="108" text-anchor="middle" class="label">Gateway</text>
  <text x="175" y="124" text-anchor="middle" class="small">:18789 · v2026.6.33</text>

  <!-- Main Agent -->
  <rect x="260" y="88" width="130" height="50" rx="6" class="node input" />
  <text x="325" y="108" text-anchor="middle" class="label">Main (курьер)</text>
  <text x="325" y="124" text-anchor="middle" class="small">sessions_send →</text>

  <!-- fz425-agent -->
  <rect x="410" y="88" width="140" height="50" rx="6" class="node process" />
  <text x="480" y="108" text-anchor="middle" class="label">fz425-agent</text>
  <text x="480" y="124" text-anchor="middle" class="small">SKILL.md + API →</text>

  <!-- fz425-verifier -->
  <rect x="410" y="190" width="140" height="50" rx="6" class="node process" />
  <text x="480" y="210" text-anchor="middle" class="label">fz425-verifier</text>
  <text x="480" y="226" text-anchor="middle" class="small">ВЕРДИКТ →</text>

  <!-- ========== KNOWLEDGE ZONE ========== -->
  <!-- Documents -->
  <rect x="30" y="370" width="180" height="50" rx="6" class="node storage" />
  <text x="120" y="390" text-anchor="middle" class="label">📄 Три документа</text>
  <text x="120" y="406" text-anchor="middle" class="small">425-ФЗ · НК ч.1 · НК ч.2</text>

  <!-- SKILL.md -->
  <rect x="260" y="290" width="230" height="110" rx="6" class="node skill" />
  <text x="375" y="312" text-anchor="middle" class="label">SKILL.md v2</text>
  <text x="375" y="328" text-anchor="middle" class="small">Приоритет документов</text>
  <text x="375" y="344" text-anchor="middle" class="small">НК — основной, 425-ФЗ — спец.</text>
  <text x="375" y="360" text-anchor="middle" class="small">Ключевые факты (со ссылками)</text>
  <text x="375" y="376" text-anchor="middle" class="small">Правило: SKILL.md > embedding</text>
  <text x="375" y="392" text-anchor="middle" class="small">⚠ Запрет утверждений без нормы</text>

  <!-- ========== SEARCH ZONE ========== -->
  <!-- law-search API -->
  <rect x="630" y="280" width="200" height="55" rx="6" class="node input" />
  <text x="730" y="300" text-anchor="middle" class="label">🔍 law-search API</text>
  <text x="730" y="318" text-anchor="middle" class="small">FastAPI :8765 · 45 мс</text>

  <!-- Expand Query -->
  <rect x="860" y="280" width="130" height="55" rx="6" class="node neutral" />
  <text x="925" y="300" text-anchor="middle" class="label">expand_query</text>
  <text x="925" y="318" text-anchor="middle" class="small">ПНО→поручение</text>

  <!-- FAISS Index -->
  <rect x="630" y="360" width="170" height="55" rx="6" class="node storage" />
  <text x="715" y="380" text-anchor="middle" class="label">🗂 FAISS IndexFlatIP</text>
  <text x="715" y="398" text-anchor="middle" class="small">2981 чанк · 4.3 MB</text>

  <!-- Model -->
  <rect x="830" y="360" width="160" height="55" rx="6" class="node storage" />
  <text x="910" y="380" text-anchor="middle" class="label">🧠 e5-small</text>
  <text x="910" y="398" text-anchor="middle" class="small">384d · 470 MB RAM</text>

  <!-- ========== INFRA ZONE ========== -->
  <!-- safe-restart -->
  <rect x="30" y="480" width="200" height="60" rx="6" class="node risk" />
  <text x="130" y="501" text-anchor="middle" class="label">♻ safe-restart.sh</text>
  <text x="130" y="518" text-anchor="middle" class="small">stop → 12s → start</text>
  <text x="130" y="532" text-anchor="middle" class="small">pkill-9 + холодный пуск</text>

  <!-- law-search.service -->
  <rect x="260" y="480" width="200" height="60" rx="6" class="node neutral" />
  <text x="360" y="501" text-anchor="middle" class="label">⚙ law-search.service</text>
  <text x="360" y="518" text-anchor="middle" class="small">systemd · enabled</text>
  <text x="360" y="532" text-anchor="middle" class="small">автозапуск при ребуте</text>

  <!-- AGENTS.md -->
  <rect x="490" y="480" width="200" height="60" rx="6" class="node neutral" />
  <text x="590" y="501" text-anchor="middle" class="label">📋 AGENTS.md</text>
  <text x="590" y="518" text-anchor="middle" class="small">Ограничение сессии</text>
  <text x="590" y="532" text-anchor="middle" class="small">sessions_spawn isolated</text>

  <!-- Chunks distribution -->
  <rect x="720" y="480" width="270" height="60" rx="6" class="node neutral" />
  <text x="855" y="500" text-anchor="middle" class="label">📊 Распределение чанков</text>
  <text x="855" y="518" text-anchor="middle" class="small">nk1: 659 · nk2: 2162 · fz425: 160</text>
  <text x="855" y="532" text-anchor="middle" class="small">keyword-обогащение + приоритет док-тов</text>

  <!-- Legend -->
  <rect x="30" y="570" width="12" height="12" rx="2" class="external" />
  <text x="48" y="580" class="small">Внешний</text>
  <rect x="90" y="570" width="12" height="12" rx="2" class="neutral" />
  <text x="108" y="580" class="small">Инфра</text>
  <rect x="150" y="570" width="12" height="12" rx="2" class="input" />
  <text x="168" y="580" class="small">API/Агент</text>
  <rect x="245" y="570" width="12" height="12" rx="2" class="process" />
  <text x="263" y="580" class="small">Обработка</text>
  <rect x="335" y="570" width="12" height="12" rx="2" class="storage" />
  <text x="353" y="580" class="small">Данные</text>
  <rect x="410" y="570" width="12" height="12" rx="2" class="skill" />
  <text x="428" y="580" class="small">Знания</text>
  <rect x="480" y="570" width="12" height="12" rx="2" class="risk" />
  <text x="498" y="580" class="small">Критичное</text>

  <!-- Footer -->
  <text x="1020" y="620" text-anchor="end" class="small">fz425-agent · v2 · 2026-08-02</text>
</svg>
</main>
</html>
