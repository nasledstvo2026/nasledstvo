<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="1" stop-color="#ffd9e8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#e8a13c"/>
    </linearGradient>
    <radialGradient id="balloon1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff9aa2"/>
      <stop offset="1" stop-color="#f56a7c"/>
    </radialGradient>
    <radialGradient id="balloon2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7fd8be"/>
      <stop offset="1" stop-color="#3fbfa0"/>
    </radialGradient>
    <radialGradient id="balloon3" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset="1" stop-color="#5a9cf5"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- confetti -->
  <g opacity="0.5">
    <circle cx="120" cy="180" r="8" fill="#f56a7c"/>
    <rect x="200" y="120" width="14" height="14" rx="3" fill="#3fbfa0" transform="rotate(20 207 127)"/>
    <circle cx="940" cy="160" r="9" fill="#f6c453"/>
    <rect x="860" y="90" width="12" height="12" rx="3" fill="#5a9cf5" transform="rotate(-15 866 96)"/>
    <circle cx="80" cy="1180" r="7" fill="#f6c453"/>
    <rect x="960" y="1150" width="13" height="13" rx="3" fill="#f56a7c" transform="rotate(25 966 1156)"/>
    <circle cx="500" cy="70" r="6" fill="#3fbfa0"/>
    <rect x="620" y="110" width="11" height="11" rx="3" fill="#f6c453" transform="rotate(40 625 115)"/>
  </g>

  <!-- balloons -->
  <g>
    <ellipse cx="200" cy="300" rx="95" ry="115" fill="url(#balloon1)"/>
    <path d="M200 415 L200 460 M200 415 L185 445 M200 415 L215 445" stroke="#c94f63" stroke-width="4" fill="none"/>
    <ellipse cx="880" cy="280" rx="95" ry="115" fill="url(#balloon2)"/>
    <path d="M880 395 L880 440 M880 395 L865 425 M880 395 L895 425" stroke="#2e9a82" stroke-width="4" fill="none"/>
    <ellipse cx="120" cy="640" rx="80" ry="95" fill="url(#balloon3)"/>
    <path d="M120 735 L120 775 M120 735 L107 762 M120 735 L133 762" stroke="#4178c9" stroke-width="4" fill="none"/>
    <ellipse cx="960" cy="620" rx="80" ry="95" fill="url(#balloon1)"/>
    <path d="M960 715 L960 755 M960 715 L947 742 M960 715 L973 742" stroke="#c94f63" stroke-width="4" fill="none"/>
  </g>

  <!-- card -->
  <rect x="90" y="250" width="900" height="900" rx="40" fill="#ffffff" stroke="#f0d9c0" stroke-width="4"/>
  <rect x="110" y="270" width="860" height="860" rx="28" fill="none" stroke="#f6c453" stroke-width="3" stroke-dasharray="2 12"/>

  <text x="540" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="52" letter-spacing="10" fill="#e8a13c">ДЕНЬ РОЖДЕНИЯ</text>

  <text x="540" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="84" font-weight="bold" fill="#5a3a3a">Приглашаю</text>
  <text x="540" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="84" font-weight="bold" fill="#5a3a3a">на праздник!</text>

  <line x1="300" y1="700" x2="780" y2="700" stroke="#f6c453" stroke-width="4" stroke-linecap="round"/>

  <text x="540" y="790" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#7a5a5a">25 октября · 18:00</text>
  <text x="540" y="860" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#7a5a5a">ул. Праздничная, 10</text>

  <!-- cake -->
  <g transform="translate(540 1040)">
    <rect x="-120" y="-40" width="240" height="70" rx="12" fill="#f7b7c6"/>
    <rect x="-90" y="-80" width="180" height="50" rx="10" fill="#f9d6c2"/>
    <rect x="-60" y="-115" width="120" height="42" rx="10" fill="#fbe3d0"/>
    <g stroke="#e8a13c" stroke-width="6" stroke-linecap="round">
      <line x1="-70" y1="-115" x2="-70" y2="-145"/>
      <line x1="0" y1="-115" x2="0" y2="-150"/>
      <line x1="70" y1="-115" x2="70" y2="-145"/>
    </g>
    <circle cx="-70" cy="-150" r="7" fill="#f6c453"/>
    <circle cx="0" cy="-155" r="7" fill="#f56a7c"/>
    <circle cx="70" cy="-150" r="7" fill="#5a9cf5"/>
  </g>
</svg>
